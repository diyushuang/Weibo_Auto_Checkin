name: build-docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    # 固定 24.04：ubuntu-latest 自 2026-10-19 起逐步切到 Ubuntu 26
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == v* ]]; then
            echo "VERSION_TAG=$TAG" >> $GITHUB_OUTPUT
            echo "TAGS=kaoqy666/weibo-checkin:$TAG,kaoqy666/weibo-checkin:latest" >> $GITHUB_OUTPUT
          else
            echo "TAGS=kaoqy666/weibo-checkin:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          echo "✅ 镜像已推送（linux/amd64 + linux/arm64）:"
          echo "  - ${{ steps.meta.outputs.TAGS }}"
