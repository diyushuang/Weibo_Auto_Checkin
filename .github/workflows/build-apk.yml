name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android-app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          cd android-app
          set +e
          sh gradlew assembleDebug --no-daemon > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            # 把编译错误转成 check 注解：无需登录也能通过 API 读到错误明细
            grep -E "^e: |error: |FAILURE|What went wrong|Caused by" -A 2 build.log \
              | grep -vE '^\s*$' | head -50 | sed 's/^/ /' | while IFS= read -r line; do
                printf '::error::%s\n' "$(echo "$line" | sed 's/"/%22/g')"
              done
            tail -40 build.log | while IFS= read -r line; do
              printf '::error::TAIL %s\n' "$(echo "$line" | sed 's/"/%22/g')"
            done
            exit $code
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wcm-app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
