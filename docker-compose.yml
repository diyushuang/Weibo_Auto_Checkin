# ============================================================
# 微博超话签到管理面板 · Docker Compose 部署
#   用法: docker compose up -d
#   数据持久化: ./data 目录挂载为 /app/data（SQLite 数据库）
#   本地构建按宿主机架构原生进行（amd64/arm64 均可）
# ============================================================
name: weibo-checkin

services:
  weibo-checkin:
    image: ${WCM_IMAGE:-weibo-checkin:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weibo-checkin
    restart: unless-stopped
    ports:
      - "${WCM_PORT:-8000}:8000"
    environment:
      - TZ=Asia/Shanghai
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - WCM_ADMIN_USER=${WCM_ADMIN_USER:-admin}
      - WCM_ADMIN_PASSWORD=${WCM_ADMIN_PASSWORD:-}
      - WCM_TRUST_PROXY=${WCM_TRUST_PROXY:-0}
    volumes:
      # SQLite 数据库持久化到宿主机 ./data
      - ./data:/app/data
    # 只读根文件系统：应用只写 /app/data 与 /tmp
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 镜像内已带 HEALTHCHECK，此处无需重复声明
